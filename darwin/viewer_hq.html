<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darwin Inc. HQ</title>
<style>
:root{
  --ink:#20263C; --muted:#687086; --indigo:#6452EA; --glass:rgba(255,255,255,.94); --glass-b:#E5E6F2;
  --green:#159a5e; --green-s:#dcf5e8; --violet:#8155E8; --violet-s:#f0eafd; --red:#c2410c; --red-s:#fde8dc;
  --gold:#c98a00; --blue:#328DDF;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#A9B7F4,#C9C7F5 55%,#F5D9E6);color:var(--ink);font-family:var(--sans);font-size:15px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;outline:none}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--glass-b);border-radius:16px;box-shadow:0 14px 40px rgba(110,112,160,.18)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#left{position:fixed;top:18px;left:20px;bottom:20px;width:360px;display:flex;flex-direction:column;gap:12px;pointer-events:none}
#left>*{pointer-events:auto}
#brand{padding:14px 18px}
#brand h1{margin:0;font-size:26px;letter-spacing:-.02em}
#brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.pill{display:inline-block;font:600 11px var(--mono);padding:3px 8px;border-radius:999px;margin-top:8px;margin-right:6px}
.pill.live{background:var(--green-s);color:var(--green)} .pill.mock{background:#fdf3d8;color:#8a5a00}
.pill.off{background:#eceae5;color:var(--muted)}
#evo{padding:10px 12px 12px;overflow:auto;min-height:0}
#evo.min{flex:0 0 auto} #evo.min #gens{display:none}
.tog{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:4px 6px}
.tog:focus-visible{outline:3px solid var(--blue)} .tog span{font-size:13px;color:var(--muted)}
#brand.min .more{display:none}
#evo h2,#org h2,#exam h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2px 6px 10px}
.gen{margin:4px 0 12px}
.gen h3{font-size:12px;margin:8px 6px 6px;color:var(--muted);font-weight:600}
.ob{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid transparent;
  background:transparent;border-radius:10px;padding:7px 8px;font:inherit;color:inherit;cursor:pointer}
.ob:hover{background:rgba(255,255,255,.7)} .ob:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.ob[aria-current="true"]{background:#fff;border-color:rgba(21,24,28,.18);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ob .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.ob .nm{font-weight:600;font-size:13.5px;line-height:1.2}
.ob .mu{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.ob .sc{font:600 13px var(--mono)}
.ob.dis .nm{color:var(--muted)} .ob.dis .sc{color:var(--muted)}
#org{position:fixed;top:18px;right:20px;width:400px;max-height:calc(100% - 190px);overflow:auto;padding:16px 18px}
#org .title{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
#org .verdict{font-size:13px;font-weight:600}
#org ol{margin:10px 0 6px;padding-left:22px;line-height:1.45;font-size:14px}
#org ol li{margin:2px 0}
#org .gov{font-size:14px;margin:6px 0;padding:8px 10px;background:var(--violet-s);border-radius:10px}
#org blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--violet);background:rgba(255,255,255,.6);border-radius:0 10px 10px 0;font-size:13.5px;color:#333}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat{background:rgba(255,255,255,.75);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font:700 17px var(--mono)} .stat span{font-size:11px;color:var(--muted)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
button.b,select{font:inherit;font-size:14px;border:1px solid rgba(21,24,28,.15);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button.b.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.b:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
details{margin-top:10px} summary{cursor:pointer;color:var(--muted);font-size:13px}
#log{font:12px var(--mono);max-height:180px;overflow:auto;margin-top:6px}
#log div{padding:2px 0;color:var(--muted)} #log div.bad{color:var(--red)} #log div.good{color:var(--green)}
#exam{position:fixed;right:20px;bottom:20px;width:400px;padding:14px 16px}
#exam .row{display:flex;gap:10px;justify-content:space-between}
#exam .c{flex:1;text-align:center;padding:6px 4px;border-radius:12px;background:rgba(255,255,255,.7)}
#exam .v{font:700 28px var(--mono);letter-spacing:-.03em}
#exam .l{font-size:11.5px;color:var(--muted)}
#askBtn{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:7;padding:10px 20px;border-radius:999px;font:600 15px var(--sans);color:#fff;background:var(--indigo);border:0;cursor:pointer;box-shadow:0 10px 28px rgba(100,82,234,.35)}
#askBtn:hover{filter:brightness(1.08)} #askBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
#ask{position:fixed;left:50%;transform:translateX(-50%);top:72px;width:min(620px,calc(100% - 32px));max-height:52vh;display:flex;flex-direction:column;padding:14px 16px;z-index:6}
#ask[hidden]{display:none}
.askHead{display:flex;align-items:center;gap:10px;margin-bottom:8px} .askHead b{font-size:16px;white-space:nowrap} #askMeta{font-size:12px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#askLog{overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45;margin-bottom:8px}
#askLog .q{align-self:flex-end;background:var(--indigo);color:#fff;padding:7px 12px;border-radius:14px 14px 4px 14px;max-width:85%}
#askLog .a{align-self:flex-start;background:#f3f2fb;padding:9px 12px;border-radius:14px 14px 14px 4px;max-width:95%;white-space:pre-wrap}
#askLog .a pre{background:#20263C;color:#e8eaf6;padding:8px 10px;border-radius:8px;overflow:auto;font-size:12.5px;white-space:pre}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px} .chips button{font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--glass-b);background:#fff;color:var(--ink);cursor:pointer}
.chips button:hover{border-color:var(--indigo);color:var(--indigo)}
#askForm{display:flex;gap:8px} #askIn{flex:1;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--glass-b);background:#fff;color:var(--ink)}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;display:flex;gap:10px;align-items:center;padding:10px 12px}
#caption{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;max-width:min(760px,calc(100% - 820px));min-width:320px;
  padding:12px 18px;font-size:19px;line-height:1.35;text-align:center;font-weight:500;transition:opacity .3s}
#caption{opacity:0;pointer-events:none} #caption.on{opacity:1}
.seg{display:inline-flex;border:1px solid rgba(21,24,28,.15);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:#fff;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--indigo);color:#fff}
.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.tech{display:none} body.explain .tech{display:block} body.explain .story-only{display:none}
.yaml{margin-top:10px} .yaml summary{cursor:pointer;font-size:13.5px;color:var(--indigo);font-weight:600} .yaml pre{max-height:220px;overflow:auto;margin-top:6px}
pre.code{font:12px/1.45 var(--mono);background:#14171a;color:#e6e8e3;border-radius:10px;padding:10px 12px;overflow:auto;max-height:240px;margin:6px 0}
pre.code .add{color:#8fe388;display:block;background:rgba(80,200,90,.12)} pre.code .del{color:#ff9a7a;display:block;background:rgba(240,100,60,.12)}
pre.code .ctx{color:#9aa0a6;display:block}
.tech h4{margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tech p{font-size:13px;margin:4px 0}
#nogl{position:fixed;inset:0;display:none;place-items:center;font-size:16px;color:var(--muted)}
@media (max-width:1180px){ #evo{display:none} #left{bottom:auto} #caption{max-width:calc(100% - 460px)} }
@media (max-width:820px){ #org{left:16px;right:16px;width:auto;top:auto;bottom:150px;max-height:40%} #exam{left:16px;right:16px;width:auto}
  #caption{max-width:calc(100% - 32px);bottom:auto;top:110px} #brand{left:16px;right:16px;max-width:none} #dock{bottom:auto;top:60px} }
}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="3D view of Darwin Inc. headquarters: each terrace is a generation of organizations, each pod an office of AI agents."></div>
<div id="nogl" class="glass">3D needs WebGL. Everything below still works as text.</div>

<div id="left">
<header id="brand" class="glass">
  <button class="tog" id="brandTog" aria-expanded="true" aria-controls="brandMore"><h1>Darwin Inc.</h1><span>hide</span></button>
  <div class="more" id="brandMore">
  <p>Human org charts are generation zero. Agents evolve past them.</p>
  <span id="mode" class="pill"></span><span id="searchPill" class="pill"></span>
  <p id="models" style="font-size:12.5px;margin-top:8px"></p>
  <p id="gateStat" style="font-size:13.5px;margin-top:4px;color:var(--ink)"></p>
  <p id="grading" style="font-size:13px;margin-top:6px;color:var(--muted)"></p>
  </div>
</header>

<nav id="evo" class="glass" aria-label="Evolution lineage">
  <button class="tog" id="evoTog" aria-expanded="true" aria-controls="gens"><h2 style="margin:0">Evolution</h2><span>hide</span></button>
  <div id="gens"></div>
</nav>
</div>

<section id="org" class="glass" aria-labelledby="orgTitle">
  <h2>Organization</h2>
  <p id="orgTitle" class="title"></p>
  <div id="orgVerdict" class="verdict"></div>
  <div id="orgBody"></div>
  <div class="ctrl">
    <label for="taskSel" class="sr">Task to replay</label>
    <select id="taskSel"></select>
    <button id="play" class="b primary" aria-keyshortcuts="Space">▶ Replay</button>
    <button id="step" class="b">Step</button>
    <label for="speed" class="sr">Replay speed</label>
    <select id="speed"><option value="1300">slow</option><option value="750" selected>normal</option><option value="320">fast</option></select>
  </div>
  <details><summary>Event log</summary><div id="log" aria-live="off"></div></details>
</section>

<section id="exam" class="glass" aria-labelledby="examH">
  <h2 id="examH">Final exam</h2>
  <div id="examRow" class="row"></div>
</section>

<div id="caption" class="glass" role="status" aria-live="polite"></div>

<button id="askBtn" class="glass" aria-controls="ask" aria-expanded="false">💬 Ask Darwin</button>
<section id="ask" class="glass" aria-label="Ask Darwin" hidden>
  <div class="askHead"><b>Ask Darwin</b><span id="askMeta"></span><button class="tog" id="askClose" aria-label="Close">✕</button></div>
  <div id="askLog" aria-live="polite"></div>
  <div class="chips" id="askChips"></div>
  <form id="askForm"><input id="askIn" placeholder="Ask about this run…" autocomplete="off" aria-label="Question"><button class="b primary">Ask</button></form>
</section>
<div id="dock" class="glass" role="toolbar" aria-label="Presentation">
  <button id="tour" class="b primary" aria-keyshortcuts="T">▶ Tour the story</button>
  <button id="overview" class="b" aria-keyshortcuts="O">Overview</button>
  <button id="examBtn" class="b" aria-keyshortcuts="F">Final exam</button>
  <button id="voice" class="b" aria-pressed="false" aria-keyshortcuts="N">🔈 Narration off</button>
  <span class="seg" role="group" aria-label="Audience">
    <button id="mStory" aria-pressed="true" aria-keyshortcuts="E">Story</button>
    <button id="mTech" aria-pressed="false" aria-keyshortcuts="E">Explain</button>
  </span>
</div>

<section id="summary" class="sr" aria-label="Run summary for screen readers"></section>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>/*__THREE__*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
const fmt = (x, d = 2) => (x == null || isNaN(x)) ? "–" : Number(x).toFixed(d);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pretty = s => String(s || "").replace(/~/g, " · ").replace(/_/g, " ");
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const live = (D.meta && D.meta.mode) === "live";
const SEARCH_ON = live && !!(D.meta && D.meta.search);
let MODE = "story";
const T = (story, tech) => MODE === "explain" ? tech : story;

// ---------------------------------------------------------------- data
const LIN = (D.lineage && D.lineage.length ? D.lineage : Object.keys(D.orgs).map(k => ({name: k, gen: 0, parent: null, mutation: null, kept: true,
  score: null, cost_usd: null, breakers: 0, errors: 0}))).filter(n => D.orgs[n.name]);
const byName = Object.fromEntries(LIN.map(n => [n.name, n]));
const FIN = D.final || {};
const champion = FIN.champion || ([...LIN].filter(n => n.kept).sort((a, b) => b.score - a.score || a.cost_usd - b.cost_usd)[0] || {}).name;
const bestHuman = FIN.best_human || null;
const heldout = Object.fromEntries((FIN.heldout || []).map(c => [c.org, c]));
const EV = {};
for (const e of (D.events || [])) if (e.org && e.task && e.task !== "*") (EV[e.org] ||= []).push(e);
const GENS = [...new Set(LIN.map(n => n.gen))].sort((a, b) => a - b);

// ---------------------------------------------------------------- plain-English descriptions
function stageText(s) {
  const who = cap(pretty(s.id));
  let t;
  switch (s.kind) {
    case "spec": t = `${who} writes the definition of done as tests`; break;
    case "plan": t = `${who} sets the direction`; break;
    case "implement": t = (s.parallel || 1) > 1 ? `${s.parallel} ${pretty(s.id)} clones build in parallel` : `${who} builds the fix`; break;
    case "select": t = `${who} picks the best attempt`; break;
    case "review":
      t = s.blind ? `${who} reviews the evidence blind, never seeing the code`
        : (s.voters || 1) > 1 ? `A panel of ${s.voters} (${s.rule}) reviews as ${pretty(s.id)}` : `${who} reviews the code`;
      t += s.can_veto === false ? " (advisory only)" : " and can send it back"; break;
    case "verify": t = `${who} runs the team's tests`; break;
    default: t = `${who} (${s.kind})`;
  }
  if (s.search) t += SEARCH_ON ? ", with You.com search" : " (search off)";
  return t;
}
function govText(o) {
  if (o.teams.length < 2) return "";
  const d = o.decide;
  return {tests: "Evidence decides: the answer passing the most of everyone's tests ships.",
          leader: "One leader picks which team's answer ships.",
          council: `No single boss: a council of ${d.voters} votes on whose work ships.`,
          router: "A dispatcher sends each task to one division."}[d.by] || d.by;
}
const MUT = {
  add_review: m => "added a reviewer with veto power",
  add_blind_review: m => "added a blind reviewer who checks the evidence but never sees the code",
  set_panel: m => `turned ${pretty(m.stage)} into a panel of ${m.n} (${m.rule || "majority"})`,
  remove_stage: m => `removed ${pretty(m.stage)}`,
  toggle_blind: m => `flipped whether ${pretty(m.stage)} can see the code`,
  toggle_veto: m => `flipped ${pretty(m.stage)}'s veto power`,
  set_parallel: m => m.n ? `had ${m.n} clones build in parallel` : `changed how many clones build in parallel`,
  toggle_search: m => `toggled web search for ${pretty(m.stage)}`,
  add_spec: m => "added a spec writer who defines done first",
  add_verify: m => "added a step that runs the team's own tests",
  add_skunkworks: m => "spun up an isolated skunkworks team",
  fork_team: m => `forked ${pretty(m.team)} into a competing team`,
  remove_team: m => `dissolved ${pretty(m.team)}`,
  toggle_isolated: m => `cut off or reconnected ${pretty(m.team)}`,
  set_governance: m => `switched governance to ${m.by === "council" ? `a council of ${m.n || 3}` : m.by}`,
  toggle_shared_memory: m => "toggled instant shared memory",
  set_max_rounds: m => `allowed ${m.n} send-backs before the circuit breaker`,
  flip_breaker: m => "switched the breaker between paging a human and shipping",
};
const SHORT = {add_review: "+ reviewer", add_blind_review: "+ blind reviewer", set_panel: "review panel", remove_stage: "− role",
  toggle_blind: "blind ↔ sighted", toggle_veto: "veto ↔", set_parallel: "× clones", toggle_search: "search ↔", add_spec: "+ spec writer",
  add_verify: "+ test step", add_skunkworks: "+ skunkworks", fork_team: "fork team", remove_team: "− team", toggle_isolated: "isolate ↔",
  set_governance: "new governance", toggle_shared_memory: "shared memory ↔", set_max_rounds: "loop limit", flip_breaker: "breaker ↔"};
const mutText = m => m ? (MUT[m.op] ? MUT[m.op](m) : m.op) : "";
const mutShort = m => m ? (m.op === "set_parallel" ? (m.n ? `×${m.n} clones` : "parallel clones") : SHORT[m.op] || m.op) : "";
function displayName(n) {
  if (n.gen === 0) return cap(pretty(n.name));
  const tag = (n.name.split("~")[1] || "").match(/g(\d+)([a-z]+)(\d*)/);
  const idea = tag ? tag[2].toUpperCase() + (tag[3] || "") : "";
  return `${cap(pretty(n.name.split("~")[0]))} · round ${n.gen}${idea ? " · idea " + idea : ""}`;
}

// ---------------------------------------------------------------- captions + narration
let voiceOn = false, capTimer = 0;
function say(text, opts = {}) {
  if (!text) return;
  $("caption").textContent = text; $("caption").classList.add("on");
  clearTimeout(capTimer);
  capTimer = setTimeout(() => { $("caption").classList.remove("on"); }, opts.hold || 7000);
  if (!voiceOn) return;
  if (API.tts) { elSay(text, opts); return; }
  webSay(text, opts);
}
function webSay(text, opts = {}) {
  if (!("speechSynthesis" in window)) return;
  if (opts.interrupt || speechSynthesis.pending) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.rate = 1.04; u.pitch = 1.0; speechSynthesis.speak(u);
}
// natural voice: ElevenLabs via `python run.py serve` (the key stays on the server)
const API = {ask: false, tts: false, search: false}, TTS_CACHE = {};
let elAudio = null, elBusy = false;
async function elSay(text, opts = {}) {
  try {
    if (elAudio) { elAudio.pause(); elAudio = null; }
    elBusy = true;
    let url = TTS_CACHE[text];
    if (!url) { const r = await fetch("/api/tts", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})});
      if (!r.ok) throw new Error("tts " + r.status); url = TTS_CACHE[text] = URL.createObjectURL(await r.blob()); }
    if (!voiceOn) { elBusy = false; return; }
    elAudio = new Audio(url); elAudio.onended = elAudio.onerror = () => { elBusy = false; };
    await elAudio.play();
  } catch (e) { elBusy = false; API.tts = false; webSay(text, opts); }
}
if (location.protocol.startsWith("http")) fetch("/api/status").then(r => r.json()).then(j => { Object.assign(API, j); onApi(); }).catch(() => {});
const speaking = () => voiceOn && (elBusy || ("speechSynthesis" in window && (speechSynthesis.speaking || speechSynthesis.pending)));
$("voice").addEventListener("click", () => {
  voiceOn = !voiceOn;
  $("voice").setAttribute("aria-pressed", voiceOn);
  $("voice").textContent = voiceOn ? "🔊 Narration on" : "🔈 Narration off";
  if (!voiceOn) { if ("speechSynthesis" in window) speechSynthesis.cancel(); if (elAudio) { elAudio.pause(); elAudio = null; } elBusy = false; }
  else say("Narration on.", {interrupt: true, hold: 2000});
});

// org identity: every org inherits the accent of the human org chart it descends from
const ORG_ACCENT = [["council", "#8057E7"], ["crusoe", "#328DDF"], ["research", "#24B77A"], ["skunk", "#FF796A"], ["startup", "#F2B544"], ["flat", "#F2B544"]];
function rootOf(name) { let n = byName[name], guard = 0; while (n && n.parent && byName[n.parent] && guard++ < 50) n = byName[n.parent]; return n ? n.name : name; }
function accentOf(name) { const r = String(rootOf(name)).toLowerCase(); for (const [k, c] of ORG_ACCENT) if (r.includes(k)) return c; return "#8155E8"; }
function tintOf(name, mix) { const c = parseInt(accentOf(name).slice(1), 16); const m = (v) => Math.round(v + (255 - v) * mix);
  return (m(c >> 16 & 255) << 16) | (m(c >> 8 & 255) << 8) | m(c & 255); }
// ---------------------------------------------------------------- Ask Darwin
function onApi() { $("askMeta").textContent = API.ask ? `Nemotron on Crusoe${API.search ? " · You.com search on" : ""}` : "";
  if (API.tts && voiceOn === false) $("voice").title = "Narration uses ElevenLabs"; }
function aesc(t) { return String(t).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"})[c]); }

function toYaml(v, ind = "") {
  const scalar = x => x === null ? "null" : typeof x === "string" ? (/^[\w.\-/ ]+$/.test(x) && !/^(true|false|null|\d)/.test(x) ? x : JSON.stringify(x)) : String(x);
  if (Array.isArray(v)) {
    if (!v.length) return "[]";
    return v.map(x => {
      if (x && typeof x === "object") { const inner = toYaml(x, ind + "  "); return `${ind}- ${inner.trimStart()}`; }
      return `${ind}- ${scalar(x)}`; }).join("\n");
  }
  if (v && typeof v === "object") {
    const keys = Object.keys(v); if (!keys.length) return "{}";
    return keys.map(k => { const x = v[k];
      if (x && typeof x === "object" && (Array.isArray(x) ? x.length : Object.keys(x).length)) return `${ind}${k}:\n${toYaml(x, ind + "  ")}`;
      return `${ind}${k}: ${Array.isArray(x) ? "[]" : x && typeof x === "object" ? "{}" : scalar(x)}`; }).join("\n");

  let html = "", gap = false;
  out.forEach((l, k) => { if (!keep.has(k)) { if (!gap) { html += `<span class="ctx">  …</span>`; gap = true; } return; } gap = false;
    html += `<span class="${l[0] === "+" ? "add" : l[0] === "-" ? "del" : "ctx"}">${l[0]} ${esc(l[1])}</span>`; });
  return html || `<span class="ctx">(no structural change)</span>`;
}

  timer = setTimeout(tick, +$("speed").value);
}
function play() { if (timer) { stopReplay(); return; } if (qi >= queue.length || qi === 0) loadTask(); $("play").textContent = "❚❚ Pause"; tick(); }
function stopReplay() { clearTimeout(timer); timer = 0; $("play").textContent = "▶ Replay"; }
function replayToEnd() { return new Promise(res => { play(); const w = () => (timer || speaking()) ? setTimeout(w, 200) : res(); setTimeout(w, 300); }); }
$("play").addEventListener("click", play);
$("step").addEventListener("click", () => { stopReplay(); if (qi >= queue.length) loadTask(); if (qi < queue.length) apply(queue[qi++]); });
$("taskSel").addEventListener("change", () => { $("taskSel").dataset.task = $("taskSel").value; loadTask(); });

// ---------------------------------------------------------------- the guided tour (your 1-minute video in one take)
const TOUR = {on: false, id: 0};
function stopTour() { if (!TOUR.on) return; TOUR.on = false; TOUR.id++; $("tour").textContent = "▶ Tour the story"; }
const pause = (ms, id) => new Promise(res => { const t0 = performance.now(); const w = () => (TOUR.id !== id) ? res() : (performance.now() - t0 >= ms && !speaking()) ? res() : setTimeout(w, 120); w(); });
async function tour() {
  if (TOUR.on) { stopTour(); return; }
  TOUR.on = true; const id = ++TOUR.id; $("tour").textContent = "■ Stop tour";
  const alive = () => TOUR.id === id;
  const gen0 = LIN.filter(n => n.gen === 0), muts = LIN.filter(n => n.gen > 0);
  await flyTo(W.overview, 1600); if (!alive()) return;
  say(T(`Meet Darwin Inc. AI workers usually get organized like a human company. These ${gen0.length} offices are human-style teams. They all get the same work.`,
        `Darwin Inc. ${gen0.length} generation-zero orgs, each a YAML file, run on Nemotron via Crusoe against the same tasks with hidden tests.`), {interrupt: true, hold: 9000});
  await pause(4200, id);
  for (const n of gen0.slice(0, 5)) { if (!alive()) return;
    select(n.name); await flyTo(podView(n.name), 1300);
    const o = D.orgs[n.name];
    say(T(`${displayName(n)}: ${o.teams.length > 1 ? o.teams.length + " teams." : o.teams[0].stages.length + " workers."} Practice score ${Math.round((n.score || 0) * 100)} percent.`,
          `${n.name}: ${o.teams.length} team(s), ${o.teams.reduce((a, t) => a + t.stages.length, 0)} stages, decide.by=${o.decide.by}, train ${fmt(n.score, 3)}.`), {interrupt: true});
    await pause(2600, id); }
  if (muts.length && alive()) {
    await flyTo(W.overview, 1400);
    say(T("Then an AI consultant watches where each team struggled and suggests one change at a time. Changes that help are kept. The rest are thrown out. Natural selection, for org charts.",
          "A Nemotron Super meta-agent reads each org's failures and proposes one structural mutation. Prompts are frozen. The gate keeps a mutant only if it beats its parent."), {interrupt: true, hold: 9000});
    await pause(4500, id);
    for (const n of muts.slice(0, 6)) { if (!alive()) return;
      select(n.name); await flyTo(podView(n.name), 1200);
      say(T(`Idea: ${mutText(n.mutation)}. ${n.kept ? "It helped. Kept." : "It didn't help. Thrown out."}`,
            `${n.mutation.op}: ${fmt(byName[n.parent]?.score, 3)} → ${fmt(n.score, 3)}. ${n.kept ? "Kept." : "Discarded."}`), {interrupt: true});
      await pause(2400, id); }
  }
  if (champion && alive()) {
    select(champion); await flyTo(podView(champion), 1500);
    const n = byName[champion] || {};
    say(T(`The winner${n.mutation ? ": the consultant " + mutText(n.mutation) : ""}. No human company has that job. Watch it work.`,
          `Champion ${n.name}${n.mutation ? " (" + n.mutation.op + ")" : ""}. Replaying a recorded task.`), {interrupt: true}); await pause(2600, id);
    if (alive() && queue.length) await replayToEnd();
  }
  if (W.podium && alive()) {
    await flyTo(examView(), 1600);
    const rows = FIN.heldout || [];
    const txt = rows.map(c => `${c.org === champion && c.org !== bestHuman ? "evolved" : c.org === bestHuman ? "best human org" : "baseline"} ${Math.round(c.score * 100)} percent`).join(", ");
    say(T(`The final exam, with brand-new questions: ${txt}.`, `Held-out tasks, never used for selection: ${txt}.`), {interrupt: true, hold: 9000}); await pause(4500, id);
  }
  if (alive()) { say(T("Human org charts were only the starting line. Darwin lets AI teams find a better way to work.", "Human org charts are generation zero. Built on NVIDIA Nemotron and Crusoe Managed Inference."), {interrupt: true}); await pause(3500, id); await flyTo(W.overview, 1600); }
  stopTour();
}
$("tour").addEventListener("click", tour);
$("overview").addEventListener("click", () => { stopTour(); flyTo(W.overview); });
const examView = () => W.podium && {target: W.podium.pos.clone(), r: Math.max(30, fitDistance(26, 14, 14, 1.0) * 1.05), theta: 0.0, phi: 1.0};
$("examBtn").addEventListener("click", () => { stopTour(); if (W.podium) { flyTo(examView());
  say(T("The final exam: brand-new jobs the teams never practiced on.", "Held-out exam: tasks never used for selection."), {interrupt: true}); } });

// ---------------------------------------------------------------- keyboard
addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (e.key === "t" || e.key === "T") tour();
  else if (e.key === "o" || e.key === "O") { stopTour(); flyTo(W.overview); }
  else if (e.key === "f" || e.key === "F") $("examBtn").click();
  else if (e.key === "n" || e.key === "N") $("voice").click();
  else if (e.key === "e" || e.key === "E") setMode(MODE === "story" ? "explain" : "story");
  else if (e.key === " " && document.activeElement.tagName !== "BUTTON") { e.preventDefault(); play(); }
  else if (e.key === "Escape") { stopTour(); stopReplay(); }
});

// ---------------------------------------------------------------- init
drawGens(); drawExam(); drawSummary(); drawGrading();
if (HAS3D) { try { buildWorld(); } catch (err) { console.error(err); $("nogl").style.display = "grid"; } }
else $("nogl").style.display = "grid";
window.DARWIN = {W, select, tour, flyTo, podView};
select(champion && D.orgs[champion] ? champion : (LIN[0] || {}).name || Object.keys(D.orgs)[0]);
if (!HAS3D) W.selected = W.selected;
</script>
</body>
