<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darwin Inc. HQ</title>
<style>
:root{
  --ink:#15181c; --muted:#5f656d; --glass:rgba(255,255,255,.82); --glass-b:rgba(21,24,28,.08);
  --green:#2f8a2a; --green-s:#e3f2da; --violet:#6b46c1; --violet-s:#efe8fb; --red:#c2410c; --red-s:#fde8dc;
  --gold:#b8860b; --blue:#1f5fa8;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#efece6;color:var(--ink);font-family:var(--sans);font-size:15px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;outline:none}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--glass-b);border-radius:16px;box-shadow:0 10px 30px rgba(30,25,15,.10)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#brand{position:fixed;top:18px;left:20px;padding:14px 18px;max-width:420px}
#brand h1{margin:0;font-size:26px;letter-spacing:-.02em}
#brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.pill{display:inline-block;font:600 11px var(--mono);padding:3px 8px;border-radius:999px;margin-top:8px;margin-right:6px}
.pill.live{background:var(--green-s);color:var(--green)} .pill.mock{background:#fdf3d8;color:#8a5a00}
.pill.off{background:#eceae5;color:var(--muted)}
#evo{position:fixed;top:150px;left:20px;bottom:150px;width:330px;padding:14px 12px 12px;overflow:auto}
#evo h2,#org h2,#exam h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2px 6px 10px}
.gen{margin:4px 0 12px}
.gen h3{font-size:12px;margin:8px 6px 6px;color:var(--muted);font-weight:600}
.ob{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid transparent;
  background:transparent;border-radius:10px;padding:7px 8px;font:inherit;color:inherit;cursor:pointer}
.ob:hover{background:rgba(255,255,255,.7)} .ob:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.ob[aria-current="true"]{background:#fff;border-color:rgba(21,24,28,.18);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ob .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.ob .nm{font-weight:600;font-size:13.5px;line-height:1.2}
.ob .mu{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.ob .sc{font:600 13px var(--mono)}
.ob.dis .nm{color:var(--muted)} .ob.dis .sc{color:var(--muted)}
#org{position:fixed;top:18px;right:20px;width:400px;max-height:calc(100% - 190px);overflow:auto;padding:16px 18px}
#org .title{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
#org .verdict{font-size:13px;font-weight:600}
#org ol{margin:10px 0 6px;padding-left:22px;line-height:1.45;font-size:14px}
#org ol li{margin:2px 0}
#org .gov{font-size:14px;margin:6px 0;padding:8px 10px;background:var(--violet-s);border-radius:10px}
#org blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--violet);background:rgba(255,255,255,.6);border-radius:0 10px 10px 0;font-size:13.5px;color:#333}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat{background:rgba(255,255,255,.75);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font:700 17px var(--mono)} .stat span{font-size:11px;color:var(--muted)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
button.b,select{font:inherit;font-size:14px;border:1px solid rgba(21,24,28,.15);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button.b.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.b:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
details{margin-top:10px} summary{cursor:pointer;color:var(--muted);font-size:13px}
#log{font:12px var(--mono);max-height:180px;overflow:auto;margin-top:6px}
#log div{padding:2px 0;color:var(--muted)} #log div.bad{color:var(--red)} #log div.good{color:var(--green)}
#exam{position:fixed;right:20px;bottom:20px;width:400px;padding:14px 16px}
#exam .row{display:flex;gap:10px;justify-content:space-between}
#exam .c{flex:1;text-align:center;padding:6px 4px;border-radius:12px;background:rgba(255,255,255,.7)}
#exam .v{font:700 28px var(--mono);letter-spacing:-.03em}
#exam .l{font-size:11.5px;color:var(--muted)}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;display:flex;gap:10px;align-items:center;padding:10px 12px}
#caption{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;max-width:min(760px,calc(100% - 820px));min-width:320px;
  padding:12px 18px;font-size:19px;line-height:1.35;text-align:center;font-weight:500;transition:opacity .3s}
#caption:empty{opacity:0}
#nogl{position:fixed;inset:0;display:none;place-items:center;font-size:16px;color:var(--muted)}
@media (max-width:1180px){ #evo{display:none} #caption{max-width:calc(100% - 460px)} }
@media (max-width:820px){ #org{left:16px;right:16px;width:auto;top:auto;bottom:150px;max-height:40%} #exam{left:16px;right:16px;width:auto}
  #caption{max-width:calc(100% - 32px);bottom:auto;top:110px} #brand{left:16px;right:16px;max-width:none} #dock{bottom:auto;top:60px} }
@media (prefers-color-scheme: dark){
  html,body{background:#14171a} :root{--ink:#eef0ec;--muted:#a3a9b0;--glass:rgba(24,28,32,.82);--glass-b:rgba(255,255,255,.08);--green-s:#1d2b17;--violet-s:#241b38;--red-s:#33201a}
  .ob:hover{background:rgba(255,255,255,.06)} .ob[aria-current="true"]{background:rgba(255,255,255,.1)} .stat,#exam .c,#org blockquote{background:rgba(255,255,255,.06)}
  button.b,select{background:#20252a;color:var(--ink);border-color:rgba(255,255,255,.15)} button.b.primary{background:#eef0ec;color:#14171a}
}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="3D view of Darwin Inc. headquarters: each terrace is a generation of organizations, each pod an office of AI agents."></div>
<div id="nogl" class="glass">3D needs WebGL. Everything below still works as text.</div>

<header id="brand" class="glass">
  <h1>Darwin Inc.</h1>
  <p>Human org charts are generation zero. Agents evolve past them.</p>
  <span id="mode" class="pill"></span><span id="searchPill" class="pill"></span>
</header>

<nav id="evo" class="glass" aria-label="Evolution lineage">
  <h2>Evolution</h2>
  <div id="gens"></div>
</nav>

<section id="org" class="glass" aria-labelledby="orgTitle">
  <h2>Organization</h2>
  <p id="orgTitle" class="title"></p>
  <div id="orgVerdict" class="verdict"></div>
  <div id="orgBody"></div>
  <div class="ctrl">
    <label for="taskSel" class="sr">Task to replay</label>
    <select id="taskSel"></select>
    <button id="play" class="b primary" aria-keyshortcuts="Space">▶ Replay</button>
    <button id="step" class="b">Step</button>
    <label for="speed" class="sr">Replay speed</label>
    <select id="speed"><option value="1300">slow</option><option value="750" selected>normal</option><option value="320">fast</option></select>
  </div>
  <details><summary>Event log</summary><div id="log" aria-live="off"></div></details>
</section>

<section id="exam" class="glass" aria-labelledby="examH">
  <h2 id="examH">Final exam · tasks evolution never saw</h2>
  <div id="examRow" class="row"></div>
</section>

<div id="caption" class="glass" role="status" aria-live="polite"></div>

<div id="dock" class="glass" role="toolbar" aria-label="Presentation">
  <button id="tour" class="b primary" aria-keyshortcuts="T">▶ Tour the story</button>
  <button id="overview" class="b" aria-keyshortcuts="O">Overview</button>
  <button id="voice" class="b" aria-pressed="false" aria-keyshortcuts="N">🔈 Narration off</button>
</div>

<section id="summary" class="sr" aria-label="Run summary for screen readers"></section>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>/*__THREE__*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
const fmt = (x, d = 2) => (x == null || isNaN(x)) ? "–" : Number(x).toFixed(d);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pretty = s => String(s || "").replace(/~/g, " · ").replace(/_/g, " ");
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const live = (D.meta && D.meta.mode) === "live";
const SEARCH_ON = live && !!(D.meta && D.meta.search);

// ---------------------------------------------------------------- data
const LIN = (D.lineage && D.lineage.length ? D.lineage : Object.keys(D.orgs).map(k => ({name: k, gen: 0, parent: null, mutation: null, kept: true,
  score: null, cost_usd: null, breakers: 0, errors: 0}))).filter(n => D.orgs[n.name]);
const byName = Object.fromEntries(LIN.map(n => [n.name, n]));
const FIN = D.final || {};
const champion = FIN.champion || ([...LIN].filter(n => n.kept).sort((a, b) => b.score - a.score || a.cost_usd - b.cost_usd)[0] || {}).name;
const bestHuman = FIN.best_human || null;
const heldout = Object.fromEntries((FIN.heldout || []).map(c => [c.org, c]));
const EV = {};
for (const e of (D.events || [])) if (e.org && e.task && e.task !== "*") (EV[e.org] ||= []).push(e);
const GENS = [...new Set(LIN.map(n => n.gen))].sort((a, b) => a - b);

// ---------------------------------------------------------------- plain-English descriptions
function stageText(s) {
  const who = cap(pretty(s.id));
  let t;
  switch (s.kind) {
    case "spec": t = `${who} writes the definition of done as tests`; break;
    case "plan": t = `${who} sets the direction`; break;
    case "implement": t = (s.parallel || 1) > 1 ? `${s.parallel} ${pretty(s.id)} clones build in parallel` : `${who} builds the fix`; break;
    case "select": t = `${who} picks the best attempt`; break;
    case "review":
      t = s.blind ? `${who} reviews the evidence blind, never seeing the code`
        : (s.voters || 1) > 1 ? `A panel of ${s.voters} (${s.rule}) reviews as ${pretty(s.id)}` : `${who} reviews the code`;
      t += s.can_veto === false ? " (advisory only)" : " and can send it back"; break;
    case "verify": t = `${who} runs the team's tests`; break;
    default: t = `${who} (${s.kind})`;
  }
  if (s.search) t += SEARCH_ON ? ", with You.com search" : " (search off)";
  return t;
}
function govText(o) {
  if (o.teams.length < 2) return "";
  const d = o.decide;
  return {tests: "Evidence decides: the answer passing the most of everyone's tests ships.",
          leader: "One leader picks which team's answer ships.",
          council: `No single boss: a council of ${d.voters} votes on whose work ships.`,
          router: "A dispatcher sends each task to one division."}[d.by] || d.by;
}
const MUT = {
  add_review: m => "added a reviewer with veto power",
  add_blind_review: m => "added a blind reviewer who checks the evidence but never sees the code",
  set_panel: m => `turned ${pretty(m.stage)} into a panel of ${m.n} (${m.rule || "majority"})`,
  remove_stage: m => `removed ${pretty(m.stage)}`,
  toggle_blind: m => `flipped whether ${pretty(m.stage)} can see the code`,
  toggle_veto: m => `flipped ${pretty(m.stage)}'s veto power`,
  set_parallel: m => `had ${m.n} clones build in parallel`,
  toggle_search: m => `toggled web search for ${pretty(m.stage)}`,
  add_spec: m => "added a spec writer who defines done first",
  add_verify: m => "added a step that runs the team's own tests",
  add_skunkworks: m => "spun up an isolated skunkworks team",
  fork_team: m => `forked ${pretty(m.team)} into a competing team`,
  remove_team: m => `dissolved ${pretty(m.team)}`,
  toggle_isolated: m => `cut off or reconnected ${pretty(m.team)}`,
  set_governance: m => `switched governance to ${m.by === "council" ? `a council of ${m.n || 3}` : m.by}`,
  toggle_shared_memory: m => "toggled instant shared memory",
  set_max_rounds: m => `allowed ${m.n} send-backs before the circuit breaker`,
  flip_breaker: m => "switched the breaker between paging a human and shipping",
};
const SHORT = {add_review: "+ reviewer", add_blind_review: "+ blind reviewer", set_panel: "review panel", remove_stage: "− role",
  toggle_blind: "blind ↔ sighted", toggle_veto: "veto ↔", set_parallel: "× clones", toggle_search: "search ↔", add_spec: "+ spec writer",
  add_verify: "+ test step", add_skunkworks: "+ skunkworks", fork_team: "fork team", remove_team: "− team", toggle_isolated: "isolate ↔",
  set_governance: "new governance", toggle_shared_memory: "shared memory ↔", set_max_rounds: "loop limit", flip_breaker: "breaker ↔"};
const mutText = m => m ? (MUT[m.op] ? MUT[m.op](m) : m.op) : "";
const mutShort = m => m ? (m.op === "set_parallel" ? `×${m.n} clones` : SHORT[m.op] || m.op) : "";
function displayName(n) { return n.gen === 0 ? pretty(n.name) : `${pretty(n.name.split("~")[0])} ${n.name.split("~")[1] || ""}`; }

// ---------------------------------------------------------------- captions + narration
let voiceOn = false, capTimer = 0;
function say(text, opts = {}) {
  if (!text) return;
  $("caption").textContent = text;
  clearTimeout(capTimer);
  capTimer = setTimeout(() => { $("caption").textContent = ""; }, opts.hold || 7000);
  if (voiceOn && "speechSynthesis" in window) {
    if (opts.interrupt || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.04; u.pitch = 1.0;
    speechSynthesis.speak(u);
  }
}
const speaking = () => voiceOn && "speechSynthesis" in window && (speechSynthesis.speaking || speechSynthesis.pending);
$("voice").addEventListener("click", () => {
  voiceOn = !voiceOn;
  $("voice").setAttribute("aria-pressed", voiceOn);
  $("voice").textContent = voiceOn ? "🔊 Narration on" : "🔈 Narration off";
  if (!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
  else say("Narration on.", {interrupt: true, hold: 2000});
});

// ---------------------------------------------------------------- panels
$("mode").textContent = live ? "LIVE · Crusoe + Nemotron" : (D.meta && D.meta.mode === "mock" ? "MOCK DATA · not results" : "run");
$("mode").className = "pill " + (live ? "live" : "mock");
$("searchPill").textContent = SEARCH_ON ? "You.com search on" : "You.com search off";
$("searchPill").className = "pill " + (SEARCH_ON ? "live" : "off");

function drawGens() {
  const box = $("gens"); box.innerHTML = "";
  for (const g of GENS) {
    const sec = document.createElement("div"); sec.className = "gen";
    const items = LIN.filter(n => n.gen === g);
    sec.innerHTML = `<h3>${g === 0 ? "Generation 0 · human org charts" : `Generation ${g} · ${items.filter(n => n.kept).length} kept of ${items.length}`}</h3>`;
    for (const n of items) {
      const b = document.createElement("button"); b.className = "ob" + (n.gen > 0 && !n.kept ? " dis" : "");
      b.dataset.org = n.name;
      const seed = n.gen === 0, star = n.name === champion;
      const icon = star ? ["★", "#b8860b"] : seed ? ["H", "#6b46c1"] : n.kept ? ["✓", "#2f8a2a"] : ["✕", "#9aa0a6"];
      const status = star ? "champion" : seed ? "human seed" : n.kept ? "kept" : "discarded";
      b.innerHTML = `<span class="ic" style="background:${icon[1]}" aria-hidden="true">${icon[0]}</span>
        <span class="nm">${esc(displayName(n))}${n.mutation ? `<span class="mu">${esc(mutShort(n.mutation))}</span>` : ""}</span>
        <span class="sc">${fmt(n.score)}</span>`;
      b.setAttribute("aria-label", `${displayName(n)}, ${status}, train score ${fmt(n.score)}${n.mutation ? ", mutation: " + mutText(n.mutation) : ""}`);
      b.addEventListener("click", () => select(n.name, {fly: true, narrate: true}));
      sec.appendChild(b);
    }
    box.appendChild(sec);
  }
}

function drawExam() {
  const rows = FIN.heldout || [];
  if (!rows.length) { $("examRow").innerHTML = `<p class="l">No final exam in this run yet.</p>`; return; }
  const role = c => c.org === champion && c.org !== bestHuman ? ["evolved", "var(--green)"] : c.org === bestHuman ? ["best human", "var(--violet)"] : ["baseline", "var(--muted)"];
  $("examRow").innerHTML = rows.map(c => { const [r, col] = role(c);
    return `<div class="c"><div class="v" style="color:${col}">${fmt(c.score)}</div><div class="l">${r}</div>
      <div class="l" style="font-family:var(--mono)">${esc(pretty(c.org))}</div></div>`; }).join("");
}

function drawSummary() {
  const parts = [`<h2>Run summary</h2><p>${live ? "Live run on Crusoe with NVIDIA Nemotron." : "Mock data, not results."} You.com search was ${SEARCH_ON ? "on" : "off"}.</p>`];
  for (const g of GENS) {
    parts.push(`<h3>Generation ${g}</h3><ul>`);
    for (const n of LIN.filter(n => n.gen === g)) {
      const o = D.orgs[n.name];
      parts.push(`<li>${esc(displayName(n))}: ${n.gen === 0 ? "human seed" : n.kept ? "kept" : "discarded"}, train score ${fmt(n.score)}.
        ${n.mutation ? "Mutation: " + esc(mutText(n.mutation)) + "." : ""} Structure: ${o.teams.map(t => t.stages.map(stageText).join(", then ")).join("; separately, ")}. ${esc(govText(o))}</li>`);
    }
    parts.push(`</ul>`);
  }
  if ((FIN.heldout || []).length) parts.push(`<h3>Final exam</h3><p>${FIN.heldout.map(c => `${pretty(c.org)} scored ${fmt(c.score)}`).join(", ")}.</p>`);
  $("summary").innerHTML = parts.join("");
}

function drawOrgCard(name) {
  const n = byName[name] || {name, gen: 0}, o = D.orgs[name];
  $("orgTitle").textContent = (name === champion ? "★ " : "") + displayName(n);
  const status = name === champion ? ["Evolved champion", "var(--gold)"] : n.gen === 0 ? ["Human org chart (seed)", "var(--violet)"]
    : n.kept ? ["✓ Kept: beat its parent", "var(--green)"] : ["✕ Discarded: did not beat its parent", "var(--muted)"];
  $("orgVerdict").innerHTML = `<span style="color:${status[1]}">${status[0]}</span>`;
  const steps = o.teams.map(t => `${o.teams.length > 1 ? `<p style="margin:10px 0 0;font-weight:600">${esc(pretty(t.name))}${t.isolated ? " · isolated" : ""}</p>` : ""}
      <ol>${t.stages.map(s => `<li>${esc(stageText(s))}</li>`).join("")}</ol>`).join("");
  const ho = heldout[name];
  const m = n.mutation;
  $("orgBody").innerHTML = `
    ${m ? `<blockquote><b>Meta-agent:</b> ${esc(cap(mutText(m)))} on <i>${esc(pretty(n.parent))}</i>.${m.reason ? `<br>“${esc(m.reason.length > 260 ? m.reason.slice(0, 257) + "…" : m.reason)}”` : ""}</blockquote>` : o.description ? `<p style="font-size:13.5px;color:var(--muted);margin:8px 0">${esc(o.description)}</p>` : ""}
    ${steps}
    ${govText(o) ? `<div class="gov">${esc(govText(o))}</div>` : ""}
    <div class="stats">
      <div class="stat"><b>${fmt(n.score)}</b><span>train</span></div>
      <div class="stat"><b>${ho ? fmt(ho.score) : "–"}</b><span>final exam</span></div>
      <div class="stat"><b>$${fmt(n.cost_usd, 4)}</b><span>cost</span></div>
      <div class="stat"><b>${n.breakers ?? 0}</b><span>breakers</span></div>
    </div>`;
  document.querySelectorAll(".ob").forEach(b => b.setAttribute("aria-current", b.dataset.org === name ? "true" : "false"));
  const tasks = [...new Set((EV[name] || []).filter(e => e.type === "start").map(e => e.task))];
  $("taskSel").innerHTML = tasks.map(t => `<option value="${esc(t)}">${esc(t.split("#")[0])}${(D.splits || {})[t.split("#")[0]] === "heldout" ? " (final exam)" : ""}</option>`).join("") || "<option>(no recorded tasks)</option>";
  const interesting = tasks.find(t => (EV[name] || []).some(e => e.task === t && (e.type === "reject" || e.type === "decision" || e.type === "loop_detected")));
  if (interesting || tasks[0]) $("taskSel").value = interesting || tasks[0];
}
// ---------------------------------------------------------------- 3D helpers
const H = {
  label(text, sub, color) {
    const c = document.createElement("canvas"); c.width = 512; c.height = 150;
    const g = c.getContext("2d");
    g.shadowColor = "rgba(0,0,0,0.12)"; g.shadowBlur = 14; g.shadowOffsetY = 4;
    g.fillStyle = "rgba(255,255,255,0.96)"; g.beginPath(); g.roundRect(12, 10, 488, 118, 40); g.fill();
    g.shadowColor = "transparent"; g.strokeStyle = color || "rgba(21,24,28,0.10)"; g.lineWidth = 3; g.stroke();
    g.fillStyle = "#15181c"; g.font = "650 50px -apple-system, Segoe UI, Inter, sans-serif"; g.textAlign = "center";
    g.fillText(text.length > 17 ? text.slice(0, 16) + "…" : text, 256, sub ? 66 : 84);
    if (sub) { g.fillStyle = "#7a7f86"; g.font = "500 30px -apple-system, Segoe UI, Inter, sans-serif"; g.fillText(sub.slice(0, 30), 256, 108); }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, depthTest: false, transparent: true}));
    sp.scale.set(3.6, 1.06, 1); sp.renderOrder = 10; return sp;
  },
  rrect(w, h, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2; r = Math.min(r, w / 2, h / 2);

      row.forEach(p => {
        p.root.position.set(x + (p.L.w + 2) / 2, y + 0.35, rz - rowD[ri] / 2);
        scene.add(p.root); W.pods[p.name] = p; x += p.L.w + 2 + GAP;
      });
      rz -= rowD[ri] + 9;
    });
    zCursor = z0 - terD - 1; maxX = Math.max(maxX, terW / 2);
    bounds.expandByPoint(new THREE.Vector3(-terW / 2, 0, z0)); bounds.expandByPoint(new THREE.Vector3(terW / 2, y + 8, z0 - terD));
  });

  // lineage beams parent -> child
  for (const n of LIN) {
    if (!n.parent || !W.pods[n.parent] || !W.pods[n.name]) continue;
    const a = W.pods[n.parent].root.position.clone(), b = W.pods[n.name].root.position.clone();
    a.y += 2.2; b.y += 2.2;
    const mid = a.clone().lerp(b, .5); mid.y = Math.max(a.y, b.y) + 7;
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    const mat = n.kept ? new THREE.MeshStandardMaterial({color: 0x52b84a, emissive: 0x3f9b3a, emissiveIntensity: .9, transparent: true, opacity: .9})
                       : new THREE.MeshStandardMaterial({color: 0x9aa0a6, transparent: true, opacity: .28, depthWrite: false});
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, n.kept ? 0.16 : 0.08, 8), mat); scene.add(tube);
    const bead = new THREE.Mesh(new THREE.SphereGeometry(n.kept ? 0.35 : 0.2, 14, 10), new THREE.MeshStandardMaterial({color: 0xffffff, emissive: n.kept ? 0x6fd060 : 0x9aa0a6, emissiveIntensity: 1}));
    scene.add(bead);
    let ml = null;
    if (n.kept) { ml = H.label(mutShort(n.mutation), "kept"); ml.scale.set(4.6, 1.4, 1); ml.position.copy(curve.getPoint(.5)).add(new THREE.Vector3(0, 1.2, 0)); scene.add(ml); }
    W.beams.push({curve, bead, kept: n.kept, child: n.name, parent: n.parent, label: ml, t0: Math.random()});
  }

  // final exam podium at the top of the staircase
  if ((FIN.heldout || []).length) {
    const y = GENS.length * TER_H, z = zCursor - 10;
    const plinth = H.slab(30, 16, y + 0.4, 0xf3efe8, {r: 2.4, rough: .8}); plinth.position.set(0, 0, z); plinth.castShadow = true; scene.add(plinth);
    const g = new THREE.Group(); g.position.set(0, y + 0.4, z); scene.add(g);
    const t = H.label("Final exam", "tasks evolution never saw"); t.scale.set(7.5, 2.2, 1); t.position.set(0, 11.5, -2); g.add(t);
    const rows = FIN.heldout;
    rows.forEach((c, i) => {
      const col = c.org === champion && c.org !== bestHuman ? 0x3f9b3a : c.org === bestHuman ? 0x6b46c1 : 0x9aa0a6;
      const h = Math.max(0.3, c.score * 8), x = (i - (rows.length - 1) / 2) * 7.5;
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.6, h, 40), new THREE.MeshStandardMaterial({color: col, roughness: .35, metalness: .1, emissive: col, emissiveIntensity: .12}));
      bar.position.set(x, h / 2, 0); bar.castShadow = true; g.add(bar); bar.userData.h = h;
      const v = H.label(fmt(c.score), c.org === champion && c.org !== bestHuman ? "evolved" : c.org === bestHuman ? "best human" : "baseline");
      v.scale.set(4.2, 1.3, 1); v.position.set(x, h + 1.6, 0); g.add(v);
      const nm = H.label(pretty(c.org)); nm.scale.set(4.6, 1.3, 1); nm.position.set(x, 0.9, 2.6); g.add(nm);
    });
    W.podium = {grp: g, pos: new THREE.Vector3(0, y + 4, z)};
    bounds.expandByPoint(new THREE.Vector3(-15, y + 12, z - 8));
  }
  W.bounds = bounds;
  const size = bounds.getSize(new THREE.Vector3()), ctr = bounds.getCenter(new THREE.Vector3());
  sun.position.set(ctr.x - 60, 90, ctr.z + 70); sun.target.position.copy(ctr);
  const ext = Math.max(size.x, size.z) * 0.7 + 20;
  Object.assign(sun.shadow.camera, {left: -ext, right: ext, top: ext, bottom: -ext, near: 1, far: 320}); sun.shadow.camera.updateProjectionMatrix();
  W.overview = overviewView();
  Object.assign(W.orbit, W.overview); W.orbit.target = W.overview.target.clone();

  // interaction: orbit, zoom, pick
  const cv = r.domElement; let drag = null, moved = 0;
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  const pick = e => { const rc = cv.getBoundingClientRect(); ptr.set(((e.clientX - rc.left) / rc.width) * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1);
    ray.setFromCamera(ptr, W.camera); const h = ray.intersectObjects(W.hits, false)[0]; return h ? h.object.userData.pod : null; };
  cv.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY}; moved = 0; cv.setPointerCapture(e.pointerId); stopTour(); W.fly = null; });
  cv.addEventListener("pointermove", e => {
    if (!drag) { cv.style.cursor = pick(e) ? "pointer" : "grab"; return; }
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy);
    W.orbit.theta -= dx * 0.005; W.orbit.phi = Math.min(1.45, Math.max(0.2, W.orbit.phi - dy * 0.004)); drag = {x: e.clientX, y: e.clientY}; W.idle = performance.now();
  });
  cv.addEventListener("pointerup", e => { if (drag && moved < 6) { const p = pick(e); if (p) select(p, {fly: true, narrate: true}); } drag = null; });
  cv.addEventListener("wheel", e => { e.preventDefault(); stopTour(); W.fly = null; W.orbit.r = Math.min(500, Math.max(8, W.orbit.r * (1 + e.deltaY * 0.0012))); W.idle = performance.now(); }, {passive: false});
  addEventListener("resize", resize); resize();
  requestAnimationFrame(frame);
}

function overviewView() {
  const size = W.bounds.getSize(new THREE.Vector3()), ctr = W.bounds.getCenter(new THREE.Vector3());
  const aspect = innerWidth / innerHeight, t = Math.tan(THREE.MathUtils.degToRad(20));
  const r = Math.max(size.x / (2 * t * Math.max(1, aspect)) , size.z * 0.9) * 0.62 + 30;
  return {target: ctr.clone().setY(ctr.y * 0.6), r: Math.min(480, r), theta: -0.32, phi: 0.92};
}
function podView(name) {
  const p = W.pods[name]; if (!p) return null;
  const t = p.root.position.clone(); t.y += 1.5;
  return {target: t, r: Math.max(16, Math.max(p.L.w, p.L.d * 1.4) * 1.05 + 6), theta: -0.28, phi: 0.98};
}
function flyTo(v, ms = 1400) {
  if (!v || !W.scene) return Promise.resolve();
  if (REDUCED) ms = 0;
  return new Promise(res => {
    W.fly = {from: {target: W.orbit.target.clone(), r: W.orbit.r, theta: W.orbit.theta, phi: W.orbit.phi}, to: v, t0: performance.now(), ms, res};
    if (!ms) { applyView(v); W.fly = null; res(); }
  });
}
function applyView(v) { W.orbit.target.copy(v.target); W.orbit.r = v.r; W.orbit.theta = v.theta; W.orbit.phi = v.phi; }
function resize() { if (!W.renderer) return; W.renderer.setSize(innerWidth, innerHeight, false); W.camera.aspect = innerWidth / innerHeight; W.camera.updateProjectionMatrix(); }

function frame(now) {
  requestAnimationFrame(frame);
  if (W.fly) {
    const f = W.fly, k = Math.min(1, (now - f.t0) / f.ms), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    W.orbit.target.lerpVectors(f.from.target, f.to.target, e);
    W.orbit.r = f.from.r + (f.to.r - f.from.r) * e; W.orbit.theta = f.from.theta + (f.to.theta - f.from.theta) * e;
    W.orbit.phi = f.from.phi + (f.to.phi - f.from.phi) * e;
    if (k >= 1) { const r = f.res; W.fly = null; r(); }
  } else if (!REDUCED && !TOUR.on && now - W.idle > 9000 && !W.selected) W.orbit.theta += 0.0006;
  const o = W.orbit, c = W.camera;
  c.position.set(o.target.x + o.r * Math.sin(o.phi) * Math.sin(o.theta), o.target.y + o.r * Math.cos(o.phi), o.target.z + o.r * Math.sin(o.phi) * Math.cos(o.theta));
  c.lookAt(o.target);
  for (const p of Object.values(W.pods)) {
    if (p.root.userData.halo) { p.root.userData.halo.rotation.z = now / 2400; p.root.userData.halo.position.y = 7.6 + 0.25 * Math.sin(now / 700); }
    if (REDUCED) continue;
    const near = c.position.distanceTo(p.root.position) < 140;
    if (!near) continue;
    for (const st of Object.values(p.stations)) {
      st.figs.forEach((f, i) => { const u = f.userData;
        const target = u.busy ? 0.12 + 0.1 * Math.abs(Math.sin(now / 140 + i)) : 0.02 * Math.sin(now / 700 + i * 1.7);
        f.position.y += (target - f.position.y) * 0.25;
        f.rotation.z = u.sad ? 0.09 * Math.sin(now / 90) : f.rotation.z * 0.85; });
      if (st.grp.userData.globe) st.grp.userData.globe.rotation.y = now / 900;
    }
    if (p.hub && p.hub.grp.userData.spin) { const s = p.hub.grp.userData.spin; s.rotation.y = now / 700; s.position.y = 1.6 + 0.12 * Math.sin(now / 500); }
  }
  for (const b of W.beams) { const k = ((now / (b.kept ? 2600 : 5200)) + b.t0) % 1; b.bead.position.copy(b.curve.getPoint(k)); }
  W.packets = W.packets.filter(p => {
    const k = Math.min(1, (now - p.t0) / p.dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    p.m.position.copy(p.curve.getPoint(e)); p.m.rotation.y = p.spin * e;
    if (k >= 1) { W.scene.remove(p.m); return false; } return true;
  });
  W.renderer.render(W.scene, c);
}
// ---------------------------------------------------------------- selection + replay
let queue = [], qi = 0, timer = 0;
function select(name, opts = {}) {
  if (!D.orgs[name]) return;
  stopReplay();
  if (W.selected && W.pods[W.selected]) setLabels(W.pods[W.selected], false);
  W.selected = name;
  drawOrgCard(name);
  if (W.pods[name]) { setLabels(W.pods[name], true); resetPod(W.pods[name]); }
  loadTask();
  if (opts.fly) flyTo(podView(name));
  if (opts.narrate) {
    const n = byName[name] || {}, o = D.orgs[name];
    say(`${displayName(n)}. ${n.mutation ? cap(mutText(n.mutation)) + ". " : ""}${n.gen > 0 ? (n.kept ? "Kept: it beat its parent." : "Discarded: it did not beat its parent.") : "A human org chart."} Train score ${fmt(n.score)}.`, {interrupt: true});
  }
}
function setLabels(p, on) {
  for (const st of Object.values(p.stations)) st.label.visible = on;
  if (p.hub) p.hub.label.visible = on;
}
function stState(st, kind) {
  const C = {active: [0x6fb6ff, 1.2, 0x2f7fd0, .9], done: [0x5fd06a, .7, 0x3f9b3a, .6], alarm: [0xff6a3d, 1.4, 0xd2603a, 1.1], idle: [null, .35, 0x2a4a70, .25]}[kind];
  for (const f of st.figs) { const u = f.userData;
    if (u.base == null) u.base = u.visorMat.emissive.getHex();
    u.visorMat.emissive.setHex(C[0] == null ? u.base : C[0]); u.visorMat.emissiveIntensity = C[1];
    u.busy = kind === "active"; u.sad = kind === "alarm"; }
  st.screen.emissive.setHex(C[2]); st.screen.emissiveIntensity = C[3];
}
function resetPod(p) {
  for (const st of Object.values(p.stations)) stState(st, "idle");
  if (p.hub) p.hub.mat.emissive.setHex(0x000000);
  for (const pk of W.packets) W.scene.remove(pk.m); W.packets = [];
}
function worldPos(obj) { return obj.getWorldPosition(new THREE.Vector3()); }
function packet(a, b, bad) {
  if (!a || !b || !W.scene) return;
  const col = bad ? 0xd2603a : 0x2f7fd0;
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.04, 0.72), new THREE.MeshStandardMaterial({color: 0xffffff, emissive: col, emissiveIntensity: bad ? .9 : .55}));
  m.castShadow = true; W.scene.add(m);
  const mid = a.clone().lerp(b, .5); mid.y += bad ? 5.5 + a.distanceTo(b) * .22 : 2.4;
  const curve = new THREE.QuadraticBezierCurve3(a.clone().add(new THREE.Vector3(0, bad ? 2.6 : 1.3, 0)), mid, b.clone().add(new THREE.Vector3(0, bad ? 2.6 : 1.3, 0)));
  W.packets.push({m, curve, t0: performance.now(), dur: Math.max(300, +$("speed").value * .9), spin: (Math.random() - .5) * 6});
}
function log(msg, cls) { const d = document.createElement("div"); d.textContent = msg; d.className = cls || ""; $("log").prepend(d); }

function loadTask() {
  stopReplay(); $("log").innerHTML = "";
  if (W.selected && W.pods[W.selected]) resetPod(W.pods[W.selected]);
  const t = $("taskSel").value; queue = (EV[W.selected] || []).filter(e => e.task === t); qi = 0;
}
function apply(e) {
  const p = W.pods[W.selected]; const team = e.team || (D.orgs[W.selected].teams[0] || {}).name;
  const st = role => p && p.stations[`${team}::${role}`];
  const who = r => cap(pretty(r));
  switch (e.type) {
    case "start": log(`start · ${e.task}`); say(`Task: ${e.task.split("#")[0]}.`, {hold: 3000}); break;
    case "stage_start": { const s = st(e.role); if (s) stState(s, "active"); break; }
    case "stage_end": { const s = st(e.role); if (s) stState(s, e.result === "next" ? "done" : "alarm");
      log(`${e.team ? e.team + "/" : ""}${e.role} → ${e.result}${e.tests != null ? ` (${e.tests} tests)` : ""}${e.voters > 1 ? ` (${e.approvals}/${e.voters} approve)` : ""}`, e.result === "next" ? "" : "bad"); break; }
    case "handoff": { const a = st(e.from), b = st(e.to); if (a && b) packet(worldPos(a.grp), worldPos(b.grp)); break; }
    case "reject": case "fail": { const a = st(e.from), b = st(e.to); if (a) stState(a, "alarm"); if (a && b) packet(worldPos(a.grp), worldPos(b.grp), true);
      const why = (e.reason || "").replace(/[`*_]/g, "").replace(/^\s*-\s*/, "").split(/\n/)[0].slice(0, 120);
      log(`${e.from} sent it back to ${e.to}: ${why}`, "bad");
      say(`${who(e.from)} sent it back${why ? ": " + why : "."}`); break; }
    case "loop_detected": { const s = st(e.role); if (s) stState(s, "alarm"); log("loop detected", "bad"); say(`Loop detected: ${pretty(e.role)} resubmitted the same work.`); break; }
    case "breaker": log(`circuit breaker → ${e.action}`, "bad"); break;
    case "page_human": log("PAGED A HUMAN", "bad"); say("Circuit breaker tripped. Paging a human.", {interrupt: true}); break;
    case "search": if (e.ran === false || (e.ran === undefined && !SEARCH_ON)) log(`${e.role}: search skipped (no You.com key)`);
      else { log(`${e.role} searched You.com`); say(`${who(e.role)} searches You.com.`); } break;
    case "route": { if (p && p.hub) { const t = D.orgs[W.selected].teams.find(t => t.name === e.to); const s = t && p.stations[`${t.name}::${t.stages[0].id}`];
        if (s) packet(worldPos(p.hub.grp), worldPos(s.grp)); } log(`router → ${e.to}`); say(`The router sends it to ${pretty(e.to)}.`); break; }
    case "decision": { if (p && p.hub) { p.hub.mat.emissive.setHex(0x3f9b3a); p.hub.mat.emissiveIntensity = .5;
        const t = D.orgs[W.selected].teams.find(t => t.name === e.picked); const s = t && p.stations[`${t.name}::${t.stages[t.stages.length - 1].id}`];
        if (s) packet(worldPos(s.grp), worldPos(p.hub.grp)); }
      const v = e.votes ? " (" + Object.entries(e.votes).map(([k, n]) => `${pretty(k)} ${n}`).join(", ") + ")" : "";
      log(`decision by ${e.by}: ${e.picked}${v}`, "good"); say(`${e.by === "council" ? "The council votes" : e.by === "tests" ? "The tests decide" : "The leader decides"}: ${pretty(e.picked)} ships${v}.`); break; }
    case "done": log(`hidden tests ${fmt(e.score)} · ${e.outcome}`, e.score >= 1 ? "good" : "");
      say(`Hidden tests: ${Math.round(e.score * 100)} percent. ${e.outcome === "escalated" ? "Escalated to a human." : "Shipped."}`, {hold: 6000}); break;
  }
}
function tick() {
  if (speaking()) { timer = setTimeout(tick, 150); return; }
  if (qi < queue.length) apply(queue[qi++]);
  if (qi >= queue.length) { stopReplay(); return; }
  timer = setTimeout(tick, +$("speed").value);
}
function play() { if (timer) { stopReplay(); return; } if (qi >= queue.length || qi === 0) loadTask(); $("play").textContent = "❚❚ Pause"; tick(); }
function stopReplay() { clearTimeout(timer); timer = 0; $("play").textContent = "▶ Replay"; }
function replayToEnd() { return new Promise(res => { play(); const w = () => (timer || speaking()) ? setTimeout(w, 200) : res(); setTimeout(w, 300); }); }
$("play").addEventListener("click", play);
$("step").addEventListener("click", () => { stopReplay(); if (qi >= queue.length) loadTask(); if (qi < queue.length) apply(queue[qi++]); });
$("taskSel").addEventListener("change", loadTask);

// ---------------------------------------------------------------- the guided tour (your 1-minute video in one take)
const TOUR = {on: false, id: 0};
function stopTour() { if (!TOUR.on) return; TOUR.on = false; TOUR.id++; $("tour").textContent = "▶ Tour the story"; }
const pause = (ms, id) => new Promise(res => { const t0 = performance.now(); const w = () => (TOUR.id !== id) ? res() : (performance.now() - t0 >= ms && !speaking()) ? res() : setTimeout(w, 120); w(); });
async function tour() {
  if (TOUR.on) { stopTour(); return; }
  TOUR.on = true; const id = ++TOUR.id; $("tour").textContent = "■ Stop tour";
  const alive = () => TOUR.id === id;
  const gen0 = LIN.filter(n => n.gen === 0), muts = LIN.filter(n => n.gen > 0);
  await flyTo(W.overview, 1600); if (!alive()) return;
  say(`Darwin Inc. Every company organizes its AI agents like a human company. These ${gen0.length} offices are human org charts: generation zero.`, {interrupt: true, hold: 9000});
  await pause(4200, id);
  for (const n of gen0.slice(0, 5)) { if (!alive()) return;
    select(n.name); await flyTo(podView(n.name), 1300);
    const o = D.orgs[n.name];
    say(`${displayName(n)}: ${o.teams.length > 1 ? o.teams.length + " teams. " + govText(o) : o.teams[0].stages.length + " roles."} Score ${fmt(n.score)}.`, {interrupt: true});
    await pause(2600, id); }
  if (muts.length && alive()) {
    await flyTo(W.overview, 1400);
    say("A Nemotron meta-agent reads where each org failed and proposes one change to its structure. A change survives only if it measurably wins.", {interrupt: true, hold: 9000});
    await pause(4500, id);
    for (const n of muts.slice(0, 6)) { if (!alive()) return;
      select(n.name); await flyTo(podView(n.name), 1200);
      say(`${cap(mutText(n.mutation))}: ${fmt(byName[n.parent]?.score)} to ${fmt(n.score)}. ${n.kept ? "Kept." : "Discarded."}`, {interrupt: true});
      await pause(2400, id); }
  }
  if (champion && alive()) {
    select(champion); await flyTo(podView(champion), 1500);
    const n = byName[champion] || {};
    say(`The champion${n.mutation ? ": " + mutText(n.mutation) : ""}. Watch it work.`, {interrupt: true}); await pause(2600, id);
    if (alive() && queue.length) await replayToEnd();
  }
  if (W.podium && alive()) {
    await flyTo({target: W.podium.pos.clone(), r: 34, theta: -0.25, phi: 1.05}, 1600);
    const rows = FIN.heldout || [];
    const txt = rows.map(c => `${c.org === champion && c.org !== bestHuman ? "evolved" : c.org === bestHuman ? "best human org" : "baseline"} ${Math.round(c.score * 100)} percent`).join(", ");
    say(`The final exam, on tasks evolution never saw: ${txt}.`, {interrupt: true, hold: 9000}); await pause(4500, id);
  }
  if (alive()) { say("Human org charts were the starting line. Built on NVIDIA Nemotron and Crusoe.", {interrupt: true}); await pause(3500, id); await flyTo(W.overview, 1600); }
  stopTour();
}
$("tour").addEventListener("click", tour);
$("overview").addEventListener("click", () => { stopTour(); flyTo(W.overview); });

// ---------------------------------------------------------------- keyboard
addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (e.key === "t" || e.key === "T") tour();
  else if (e.key === "o" || e.key === "O") { stopTour(); flyTo(W.overview); }
  else if (e.key === "n" || e.key === "N") $("voice").click();
  else if (e.key === " " && document.activeElement.tagName !== "BUTTON") { e.preventDefault(); play(); }
  else if (e.key === "Escape") { stopTour(); stopReplay(); }
});

// ---------------------------------------------------------------- init
drawGens(); drawExam(); drawSummary();
if (HAS3D) { try { buildWorld(); } catch (err) { console.error(err); $("nogl").style.display = "grid"; } }
else $("nogl").style.display = "grid";
window.DARWIN = {W, select, tour, flyTo, podView};
select(champion && D.orgs[champion] ? champion : (LIN[0] || {}).name || Object.keys(D.orgs)[0]);
if (!HAS3D) W.selected = W.selected;
</script>
